  <title>City DAM  - La Ciudad del Futuro</title>
</head>

<body>  
<h2>Formulario de Registro de Ciudadanos</h2>

  <form>
    <p>
      <label for="nombre">Nombre completo:</label><br>
      <input type="text" id="nombre" name="nombre" required="">
    </p>

    <label for="ciudad">Zonas de City DAM :</label><br>
    <select id="ciudad" name="ciudad">
      <option value="neurotech">Zona NeuroTech</option>
      <option value="biosfera">Biosfera Verde</option>
      <option value="quantum">Distrito Quantum</option>
    </select>

    <p><b>Seleccione sus intereses ciudadanos:</b><br>

      <input type="checkbox" id="movilidad" name="intereses" value="Movilidad Autónoma">
      <label for="movilidad">Movilidad Autónoma</label><br>

      <input type="checkbox" id="energia" name="intereses" value="Energía Renovable">
      <label for="energia">Energía Renovable</label><br>

      <input type="checkbox" id="robotica" name="intereses" value="Robótica y Automatización">
      <label for="robotica">Robótica y Automatización</label>

    </p>

    <p>
      <label for="comentario">Comentario:</label><br>
      <textarea id="comentario" name="comentario" rows="5" cols="40" placeholder="Cuéntanos tu visión del futuro..."></textarea>
    </p><p>
      <input type="submit" value="Registrarse en City DAM ">
      <input type="reset" value="Borrar">
    </p>

  </form>

  <hr>



</body></html>
