<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Práctica: Calculadora</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <main class="contenedor">
    <h1>Calculadora básica</h1>
    <p class="sub">Suma, resta, multiplica y divide sin dramas (bueno, si divides entre 0 sí).</p>

    <form id="formulario">
      <div class="fila">
        <label for="num1">Número 1</label>
        <input type="number" id="num1" step="any" placeholder="Ej: 12.5" required/>
      </div>

      <div class="fila">
        <label for="num2">Número 2</label>
        <input type="number" id="num2" step="any" placeholder="Ej: 3" required/>
      </div>

      <div class="fila">
        <label for="operacion">Operación</label>
        <select id="operacion">
          <option value="sumar">Sumar (+)</option>
          <option value="restar">Restar (-)</option>
          <option value="multiplicar">Multiplicar (×)</option>
          <option value="dividir">Dividir (÷)</option>
        </select>
      </div>

      <div class="botones">
        <button type="submit">Calcular</button>
        <button type="reset" id="btnLimpiar">Limpiar</button>
      </div>
    </form>

    <section class="resultado">
      <h2>Resultado</h2>
      <p id="resultado">Introduce números y elige una operación.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
