<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venta de coche de segunda mano</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- Título principal -->
  <h1>Formulario de venta de coche de segunda mano</h1>

  <!-- Formulario -->
  <form id="formularioCoche">

    <label for="marca">Marca:</label>
    <input type="text" id="marca" required>

    <label for="modelo">Modelo:</label>
    <input type="text" id="modelo" required>

    <label for="anio">Año:</label>
    <input type="number" id="anio" required>

    <label for="kilometros">Kilómetros:</label>
    <input type="number" id="kilometros" required>

    <label for="combustible">Combustible:</label>
    <select id="combustible" required>
      <option value="">Selecciona una opción</option>
      <option value="Gasolina">Gasolina</option>
      <option value="Diésel">Diésel</option>
      <option value="Híbrido">Híbrido</option>
      <option value="Eléctrico">Eléctrico</option>
    </select>

    <label for="precio">Precio:</label>
    <input type="number" id="precio" required>

    <label for="vendedor">Vendedor:</label>
    <input type="text" id="vendedor" required>

    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" required>

    <button type="submit">Enviar datos</button>
  </form>

  <!-- Zona donde se mostrará el JSON -->
  <h2>JSON generado</h2>
  <pre id="salidaJSON"></pre>

  <script src="script.js"></script>
</body>
</html>
