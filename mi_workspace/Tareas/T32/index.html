<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de Paciente</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <main class="contenedor">
    <div class="tarjeta">
      <h1>Registro de Paciente</h1>
      <p class="sub">Completa los datos. </p>

      <form id="formPaciente" class="grid-form">
        <!-- Inputs -->
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Laura" required />
        </div>

        <div class="campo">
          <label for="apellidos">Apellidos</label>
          <input type="text" id="apellidos" name="apellidos" placeholder="Ej: Ruiz López" required />
        </div>

        <div class="campo">
          <label for="dni">DNI / Pasaporte</label>
          <input type="text" id="dni" name="dni" placeholder="Ej: 12345678A" required />
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ej: 600123123" required />
        </div>

        <div class="campo">
          <label for="edad">Edad</label>
          <input type="number" id="edad" name="edad" min="0" max="130" placeholder="Ej: 38" required />
        </div>

        <!-- Selects -->
        <div class="campo">
          <label for="grupoSanguineo">Grupo sanguíneo</label>
          <select id="grupoSanguineo" name="grupoSanguineo" required>
            <option value="" selected disabled>Selecciona</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
          </select>
        </div>

        <div class="campo">
          <label for="prioridad">Prioridad de atención</label>
          <select id="prioridad" name="prioridad" required>
            <option value="" selected disabled>Selecciona</option>
            <option value="Normal">Normal</option>
            <option value="Preferente">Preferente</option>
            <option value="Urgente">Urgente</option>
          </select>
        </div>

        <!-- Checkbox -->
        <div class="campo campo-full">
          <label class="check">
            <input type="checkbox" id="consentimiento" name="consentimiento" />
            Consentimiento informado 
          </label>
        </div>

        <!-- Botones -->
        <div class="acciones campo-full">
          <button type="submit" class="btn btn-principal">Enviar</button>
          <button type="reset" class="btn btn-secundario" id="btnLimpiar">Limpiar</button>
        </div>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
