<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario DOM</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <h1>Formulario de registro</h1>
    <form id="formulario" class="mi-formulario">
        <label>
            Nombre:
            <br>
            <input type="text" name="nombre" id="nombre">
        </label>
        <br><br>
        <label>
            Correo electrónico:
            <br>
            <input type="email" name="email" id="email">
        </label>
        <br><br>
        <button type="submit">Enviar</button> <!--Esto es un evento dentro del formulario, no hace falta ponerle un ID para poder pillarlo luego con JS-->
    </form>
    <p id="mensaje"></p>
    <script src="script.js">
    </script>
</body>

</html>
